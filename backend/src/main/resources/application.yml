spring:
  application:
    name: todo-app
  profiles:
    default: dev

  config:
    # Makes the documented `.env` workflow actually work. Without this Spring
    # only sees real environment variables, and a .env file would be ignored -
    # which is exactly the kind of thing that silently leaves Google login off.
    # Covers both layouts: running from the repo root, and from backend/.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  jpa:
    # Flyway owns the schema. Hibernate only verifies it matches the entities.
    hibernate:
      ddl-auto: validate
    # Avoids holding a DB connection open for the whole HTTP request
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast rather than hanging a request for the OS TCP timeout.
      connect-timeout: 2s
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1

server:
  port: 8080

app:
  cache:
    # Time-to-live is a SAFETY NET, not the correctness mechanism. Correctness
    # comes from evicting on write. TTL only bounds how long a bug can hide
    # stale data if an eviction is ever missed.
    todo-ttl: ${TODO_CACHE_TTL:10m}
    stats-ttl: ${STATS_CACHE_TTL:5m}
    # Log a warning when Redis is unreachable instead of throwing. A cache
    # outage should slow the app down, not break it.
    fail-open: ${CACHE_FAIL_OPEN:true}
  jwt:
    # HS256 signing key - must be >= 32 bytes. Override with JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-insecure-key-please-override-me-1234567890}
    expiration: 7d
    cookie-name: todo_token
    secure: false
  google:
    # >>> PASTE YOUR GOOGLE CREDENTIALS HERE (or set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET env vars) <<<
    client-id: ${GOOGLE_CLIENT_ID:PASTE_YOUR_GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET:PASTE_YOUR_GOOGLE_CLIENT_SECRET}
    # Must match an Authorised redirect URI in the Google Cloud console exactly.
    # Pinned here so it does not shift when a proxy rewrites the Host header.
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
  # Where the browser is sent once Google hands control back to us
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  account-linking:
    # Lets a Google login attach to an existing password account with the same email.
    # Set to false for any deployment on the public internet until real email
    # verification exists - see the comment on AppProperties.AccountLinking.
    enabled: ${ACCOUNT_LINKING_ENABLED:true}

logging:
  level:
    com.todoapp: INFO
